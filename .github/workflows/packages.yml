# One GitHub Package named "forum" (GHCR image: ghcr.io/<owner>/forum).
# Backend and frontend are different *tags* of that single package.

name: Packages

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version segment for tags (e.g. 0.1.0-alpha.1)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  push:
    name: Build & push forum (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        shell: bash
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # Single package name = repository name (forum)
          IMAGE="ghcr.io/${OWNER_LC}/forum"
          VER="${{ github.event.inputs.version }}"
          SHA_SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend tags
        id: backend-tags
        shell: bash
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          SHA="${{ steps.img.outputs.sha }}"
          VER="${{ steps.img.outputs.ver }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:backend"
            echo "${IMAGE}:backend-edge"
            echo "${IMAGE}:backend-sha-${SHA}"
            if [[ -n "$VER" ]]; then
              echo "${IMAGE}:backend-${VER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push backend → forum:backend*
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=forum
            org.opencontainers.image.description=Forum (backend API)
            org.opencontainers.image.component=backend
          cache-from: type=gha,scope=forum-backend
          cache-to: type=gha,mode=max,scope=forum-backend

      - name: Frontend tags
        id: frontend-tags
        shell: bash
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          SHA="${{ steps.img.outputs.sha }}"
          VER="${{ steps.img.outputs.ver }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:frontend"
            echo "${IMAGE}:frontend-edge"
            echo "${IMAGE}:frontend-sha-${SHA}"
            if [[ -n "$VER" ]]; then
              echo "${IMAGE}:frontend-${VER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push frontend → forum:frontend*
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            PUBLIC_API_URL=http://localhost:3000/api/v1
          tags: ${{ steps.frontend-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=forum
            org.opencontainers.image.description=Forum (web UI)
            org.opencontainers.image.component=frontend
          cache-from: type=gha,scope=forum-frontend
          cache-to: type=gha,mode=max,scope=forum-frontend
