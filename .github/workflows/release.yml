name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  package:
    name: Build package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forum-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # Single GitHub Package: "forum" (ghcr.io/<owner>/forum)
  packages:
    name: Publish forum to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive names
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/forum"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend tags
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}:backend
            ${{ steps.ver.outputs.image }}:backend-${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:backend-${{ steps.ver.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=forum
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.component=backend
          cache-from: type=gha,scope=forum-backend
          cache-to: type=gha,mode=max,scope=forum-backend

      - name: Push frontend tags
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            PUBLIC_API_URL=http://localhost:3000/api/v1
          tags: |
            ${{ steps.ver.outputs.image }}:frontend
            ${{ steps.ver.outputs.image }}:frontend-${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:frontend-${{ steps.ver.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=forum
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.component=frontend
          cache-from: type=gha,scope=forum-frontend
          cache-to: type=gha,mode=max,scope=forum-frontend

  publish:
    name: GitHub Release
    needs: [package, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Detect prerelease
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # List title like NodeBB: "v0.1.0" or "v0.1.0 (a.1)" for alpha.1
          # Git tag stays full (v0.1.0-alpha.1) — visible when you open the release.
          BASE="${VERSION%%-*}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#${BASE}-}"
            # alpha.1 → a.1, beta.2 → b.2, rc.1 → rc.1
            case "$PRE" in
              alpha.*) SHORT="a.${PRE#alpha.}" ;;
              beta.*)  SHORT="b.${PRE#beta.}" ;;
              rc.*)    SHORT="rc.${PRE#rc.}" ;;
              *)       SHORT="$PRE" ;;
            esac
            TITLE="v${BASE} (${SHORT})"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "pre_label=${PRE}" >> "$GITHUB_OUTPUT"
          else
            TITLE="v${BASE}"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "pre_label=" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/forum" >> "$GITHUB_OUTPUT"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          # Releases list: "v0.1.0 (a.1)". Tag v0.1.0-alpha.1 on the detail page.
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
          body: |
            ## ${{ steps.meta.outputs.title }}

            Tag: `${{ steps.meta.outputs.tag }}`

            ### GitHub Package
            Single package: **forum**

            ```bash
            docker pull ${{ steps.meta.outputs.image }}:backend-${{ steps.meta.outputs.version }}
            docker pull ${{ steps.meta.outputs.image }}:frontend-${{ steps.meta.outputs.version }}
            ```

            Packages: https://github.com/${{ github.repository }}/pkgs/container/forum

            ### Portable tarball
            ```bash
            tar -xzf forum-*-*.tar.gz
            cd forum-*
            ./run-backend.sh
            ./run-frontend.sh
            ```

            See `docs/DEPLOY.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
