[package]
name = "forum-backend"
version = "0.8.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "set-header", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off: sqlx's defaults pull mysql/postgres (and rsa), which we don't use.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
tower = "0.5"
bcrypt = "0.17"
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
validator = { version = "0.19", features = ["derive"] }
regex = "1"
time = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
rand = "0.8"
futures-util = "0.3.33"
sha2 = "0.11.0"
hex = "0.4.3"
bytes = "1.12.1"
uuid = { version = "1.24.0", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip"] }
url = "2.5.8"
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
