# Example nginx reverse proxy for Forum.
# Include from http {} or sites-enabled.
#
# Upstream: API :3000, UI :4321. Terminate TLS here; set COOKIE_SECURE=true
# and ENABLE_HSTS=true (or rely on add_header below).

upstream forum_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream forum_ui {
    server 127.0.0.1:4321;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name forum.example.com;

    # ssl_certificate     /etc/letsencrypt/live/forum.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/forum.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /media/ {
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # media is content-addressed + immutable
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        proxy_pass http://forum_api;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://forum_api;
        # Restrict in production, e.g. allow 10.0.0.0/8;
    }

    location / {
        proxy_pass http://forum_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
